name: Materialize source from release ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'chore: materialize source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rk-social-src
          mkdir -p /tmp/rk-social-src
          unzip -q rk-social-automation-mcp-complete-v2.zip -d /tmp/rk-social-src
          ROOT=/tmp/rk-social-src/rk-social-automation-mcp
          test -f "$ROOT/package.json"
          rsync -a --exclude '.git/' --exclude 'rk-social-automation-mcp-complete-v2.zip' "$ROOT/" ./

      - name: Validate source
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -d src
          test -d tests
          node --check src/index.mjs
          node --check src/worker.mjs

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RK Digital Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged rk-social-automation-mcp-complete-v2.zip 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize source"
          git push origin HEAD:main
